name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check repository scaffolding invariants
        run: python tools/learning.py doctor
      - name: Verify structured runtime contract
        run: python tools/runtime.py --repo . verify

  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Test workspace adapter
        run: npm test
      - name: Typecheck workspace
        run: npm run typecheck
      - name: Build workspace
        run: npm run build
