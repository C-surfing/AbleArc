name: ci

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical AbleArc Skill
        run: |
          python - <<'PY'
          from pathlib import Path
          skill = Path("skills/ablearc/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          required = [
              "name: ablearc",
              "Never steal the learner's moment of discovery",
              "Archify",
              "university-textbook",
              "youtube-render-pdf",
              "bilibili-render-pdf",
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f"missing canonical Skill markers: {missing}"
          forbidden = ["tools/runtime.py", "DecisionProposal", "EvidenceReceipt", "apps/workspace", "apps/mcp"]
          present = [item for item in forbidden if item in text]
          assert not present, f"canonical Skill depends on retired infrastructure: {present}"
          for path in [
              "skills/ablearc/references/pedagogy.md",
              "skills/ablearc/references/evidence.md",
              "skills/ablearc/references/review.md",
              "skills/ablearc/references/learner-model.md",
              "skills/ablearc/references/companion-skills.md",
              "tests/SKILL-BEHAVIOR.md",
          ]:
              assert Path(path).is_file(), path
          PY

  legacy-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run surviving deterministic regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify surviving learning/runtime utilities
        run: |
          python tools/learning.py doctor
          python tools/runtime.py --repo . verify
