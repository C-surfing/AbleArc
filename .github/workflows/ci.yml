name: ci

on:
  push:
  pull_request:

jobs:
  spec:
    name: Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned skills-ref validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate Agent Skill format
        run: skills-ref validate skills/ablearc

  repository:
    name: Policy and docs regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate learning-control package
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          skill = Path("skills/ablearc/SKILL.md")
          text = skill.read_text(encoding="utf-8")

          required_markers = [
              "name: ablearc",
              "license: Apache-2.0",
              "continue normally",
              "Core",
              "Review",
              "Delegate",
              "learning opportunity",
              "Understanding debt",
              "Archify",
              "university-textbook",
              "youtube-render-pdf",
              "bilibili-render-pdf",
              "source-bounded",
              "skills-for-learning",
              "corpus-to-skill",
          ]
          missing = [x for x in required_markers if x not in text]
          assert not missing, f"missing Skill policy markers: {missing}"
          assert len(text.splitlines()) <= 500, "SKILL.md should stay under 500 lines"

          required_files = [
              "LICENSE",
              "CONTRIBUTING.md",
              "skills/ablearc/agents/openai.yaml",
              "skills/ablearc/references/pedagogy.md",
              "skills/ablearc/references/teaching-taste.md",
              "skills/ablearc/references/practice.md",
              "skills/ablearc/references/evidence.md",
              "skills/ablearc/references/review.md",
              "skills/ablearc/references/learner-model.md",
              "skills/ablearc/references/longitudinal-teaching.md",
              "skills/ablearc/references/visual-teaching.md",
              "skills/ablearc/references/paper-learning.md",
              "skills/ablearc/references/companion-skills.md",
              "skills/ablearc/references/learning-opportunities.md",
              "skills/ablearc/templates/learning-state.md",
              "adapters/chatgpt-project/PROJECT_INSTRUCTIONS.md",
              "adapters/generic/SYSTEM_PROMPT.md",
              "docs/COMPATIBILITY.md",
              "docs/adr/0013-learning-control-layer.md",
              "examples/software-debugging.md",
              "examples/cuda-longitudinal.md",
              "examples/paper-learning.md",
              "evaluation/benchmark/README.md",
              "evaluation/benchmark/RUBRIC.md",
              "evaluation/benchmark/RUN-TEMPLATE.md",
              "prompts/WORK-LEARN-BASELINE.md",
              "tests/SKILL-BEHAVIOR.md",
          ]
          for path in required_files:
              assert Path(path).is_file(), path

          retired = ["apps", "plugins", "tools", "schemas", "templates"]
          present = [p for p in retired if (root / p).exists()]
          assert not present, f"retired infrastructure returned: {present}"

          forbidden = [
              "tools/runtime.py",
              "DecisionProposal",
              "EvidenceReceipt",
              "apps/workspace",
              "apps/mcp",
              "Provider setup",
          ]
          bad = [x for x in forbidden if x in text]
          assert not bad, f"canonical Skill depends on retired infrastructure: {bad}"
          PY

      - name: Check local Markdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re

          root = Path(".").resolve()
          broken = []

          link_re = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")

          for md in root.rglob("*.md"):
              text = md.read_text(encoding="utf-8")
              for raw in link_re.findall(text):
                  target = raw.strip()
                  if target.startswith("<") and target.endswith(">"):
                      target = target[1:-1]
                  if " " in target and not target.startswith(("http://", "https://")):
                      target = target.split(" ", 1)[0]
                  if target.startswith(("#", "http://", "https://", "mailto:", "app://")):
                      continue
                  target = unquote(target.split("#", 1)[0].split("?", 1)[0])
                  if not target:
                      continue

                  if target.startswith("/"):
                      resolved = root / target.lstrip("/")
                  else:
                      resolved = md.parent / target

                  if not resolved.exists():
                      broken.append(f"{md.relative_to(root)} -> {target}")

          assert not broken, "broken local Markdown links:\n" + "\n".join(broken)
          PY
